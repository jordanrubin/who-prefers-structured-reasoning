[conference]
name = "International Conference on Learning Representations"
abbreviation = "ICLR"
year = 2025
event = "Oral Presentations"
dates = "April 24–28"
location = "Singapore"

[corpus]
index_path = "data/iclr2025_oral_index.json"

[domain]
field = "machine learning and artificial intelligence research"
audience = "an ML researcher and practitioner"

[[domain.special_topics]]
name = "LLMs and scaling"
full_name = "large language models and scaling laws"
attention = "new architectures, training efficiency, emergent capabilities, scaling phenomena, or anything that shifts understanding of foundation model behavior"

[[domain.special_topics]]
name = "safety and alignment"
full_name = "AI safety, alignment, fairness, and privacy"
attention = "new alignment techniques, safety evaluations, robustness guarantees, fairness methods, or evidence that changes how we think about responsible AI deployment"

