abbreviation = "AUSA"
year = 2025
event = "Annual Reporting"
dates = "January–December"
location = "Washington, DC"

[corpus]
index_path = "data/ausa2025_news_index.json"

[domain]
field = "U.S. Army policy, modernization, and defense readiness"
audience = "a defense professional tracking Army transformation and readiness"

[[domain.special_topics]]
name = "Army transformation"
